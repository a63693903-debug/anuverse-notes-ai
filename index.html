<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnuVerse Notes AI</title>
<style>
body{font-family:sans-serif;background:#f5f0ff;padding:15px}
h2{text-align:center;color:#7c3aed}
.card{background:white;padding:18px;border-radius:18px}
textarea{width:100%;height:90px;border-radius:12px;border:2px solid #c4b5fd;padding:12px;box-sizing:border-box}
button{background:#7c3aed;color:white;border:none;padding:13px;width:100%;border-radius:12px;font-weight:bold;margin-top:10px}
#output{background:#f8f7ff;padding:14px;border-radius:12px;margin-top:12px;line-height:1.6;min-height:60px;white-space:pre-wrap}
.loader{height:4px;width:100%;background:#ede9fe;border-radius:10px;overflow:hidden;margin-top:8px;display:none}
.loader div{height:100%;width:50%;background:#7c3aed;animation:load 1s infinite linear}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
</style>
</head>
<body>
<h2>🚀 AnuVerse Notes AI</h2>
<div class="card">
<textarea id="q">Tell me about natyashastra</textarea>
<button id="btn" onclick="ask()">✨ Ask From Real AI</button>
<div class="loader" id="loader"><div></div></div>
<div id="output">Answer from Real AI will appear here...</div>
</div>

<script>
// Cache - 2nd time 0 sec me ayega
let cache = JSON.parse(localStorage.getItem("anu_cache")||"{}");

async function ask(){
 let q=document.getElementById("q").value.trim();
 let out=document.getElementById("output");
 let btn=document.getElementById("btn");
 let loader=document.getElementById("loader");
 if(!q) return;

 if(cache[q]){
   out.innerHTML = cache[q];
   return;
 }

 out.innerHTML = "";
 loader.style.display="block";
 btn.disabled=true;
 btn.innerText="⏳ Thinking...";

 try{
  // FASTEST FREE API - Hack Club AI
  let res = await fetch("https://ai.hackclub.com/chat/completions",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body: JSON.stringify({
     model:"llama-3.3-70b-versatile",
     messages:[{role:"user", content:`Explain ${q} in simple English under 90 words. Format exactly like: Definition: ... \n3 Key Points: - point1 - point2 - point3 \nTrick: ... \nExam Tip: ... No stars.`}],
     stream:false
   })
  });
  let data = await res.json();
  let text = data.choices[0].message.content || "No response";

  // Clean stars
  let clean = text.replaceAll("**","").replaceAll("*","").replaceAll("###","").trim();
  
  // Save to cache
  cache[q]=clean.replaceAll("\n","<br>");
  localStorage.setItem("anu_cache", JSON.stringify(cache));
  
  out.innerHTML = cache[q];

 }catch(e){
   // Fallback fast
   let r = await fetch("https://text.pollinations.ai/"+encodeURIComponent(q+" in 80 words simple")+ "?model=openai-fast&seed="+Date.now());
   out.innerText = (await r.text()).replaceAll("**","");
 }
 loader.style.display="none";
 btn.disabled=false;
 btn.innerText="✨ Ask From Real AI";
}
</script>
</body>
</html>
