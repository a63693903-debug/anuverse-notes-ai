<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnuVerse AI - Real AI</title>
<style>
body{font-family:sans-serif;background:#f5f0ff;padding:15px;margin:0}
h2{text-align:center;color:#7c3aed}
.card{background:white;padding:20px;border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,0.08)}
textarea{width:100%;height:120px;border-radius:12px;border:2px solid #c4b5fd;padding:12px;font-size:15px;box-sizing:border-box}
button{background:#7c3aed;color:white;border:none;padding:14px;width:100%;border-radius:12px;font-size:17px;font-weight:bold;margin-top:12px;cursor:pointer}
button:disabled{opacity:0.6}
#output{background:#ede9fe;padding:16px;border-radius:12px;margin-top:16px;white-space:pre-wrap;line-height:1.7;color:#222;font-size:14px;min-height:80px}
</style>
</head>
<body>
<h2>🚀 AnuVerse Notes AI</h2>
<p style="text-align:center;font-size:13px;color:#666;margin-top:0"><b>Built by Anushka</b><br>Engineering First Year | CSE AIML | Real AI Connected</p>

<div class="card">
<textarea id="q" placeholder="Kuch bhi pucho... Ship wala sawal bhi!"></textarea>
<button id="btn" onclick="askRealAI()">✨ Real AI se Pucho</button>
<div id="output">Yaha real AI ka jawab ayega...</div>
</div>

<script>
async function askRealAI(){
  let input = document.getElementById('q').value.trim();
  let out = document.getElementById('output');
  let btn = document.getElementById('btn');
  if(!input){ alert('Pehle kuch likho!'); return; }
  
  btn.disabled = true;
  btn.innerText = "AI Soch Raha Hai... 🤔";
  out.innerText = "⏳ Real AI se jawab laya ja raha hai, 3 sec ruko...";

  try {
    // Ye free Real AI API hai - koi bhi sawal ka jawab dega
    let response = await fetch('https://text.pollinations.ai/' + encodeURIComponent("You are AnuVerse AI, built by Anushka, a first year CSE AIML student. Explain in simple Hinglish, easy language, with points and examples. Question: " + input));
    let data = await response.text();
    out.innerText = "📌 " + data + "\n\n✅ Answered by AnuVerse Real AI | Built by Anushka";
  } catch (e) {
    out.innerText = "❌ Internet error! Dobara try karo. \nError: " + e;
  }
  
  btn.disabled = false;
  btn.innerText = "✨ Real AI se Pucho";
}
</script>
</body>
</html>
