<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnuVerse Notes AI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
*{font-family:'Inter',sans-serif;box-sizing:border-box}
body{background:#f8f7ff;margin:0;padding:14px;color:#1f2937}
.container{max-width:700px;margin:0 auto}
header{text-align:center;padding:18px 0}
header h1{font-size:26px;font-weight:700;margin:0}
header p{color:#6b7280;font-size:13px;margin-top:6px}
.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(124,58,237,.08);border:1px solid #ede9fe}
textarea{width:100%;min-height:115px;border:1.5px solid #e5e7eb;border-radius:16px;padding:16px;font-size:16px;outline:none;resize:none}
textarea:focus{border-color:#7c3aed;box-shadow:0 0 0 4px rgba(124,58,237,.1)}
textarea::placeholder{color:#9ca3af}
.btn{width:100%;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;border:none;padding:16px;border-radius:14px;font-size:16px;font-weight:700;margin-top:14px;cursor:pointer}
.btn:disabled{opacity:.6}
.output-wrap{margin-top:18px;background:#fcfcff;border:1px solid #e9e5ff;border-radius:16px;padding:16px;min-height:120px}
.label{font-size:11px;font-weight:700;color:#7c3aed;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between}
#output{line-height:1.8;font-size:15px;white-space:pre-wrap;color:#1f2937}
.ph{color:#9ca3af;font-size:14px}
.loader{display:flex;gap:5px;align-items:center}
.dot{width:6px;height:6px;background:#7c3aed;border-radius:50%;animation:b 1.4s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes b{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
.fade{animation:f .3s ease}
@keyframes f{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="container">
<header>
<h1>✨ AnuVerse Notes AI</h1>
<p>Your intelligent study companion</p>
</header>
<div class="card">
<textarea id="q" placeholder="Ask anything... e.g., How many chapters in Bhagavad Gita? Explain PN junction"></textarea>
<button class="btn" onclick="ask()" id="btn">⚡ Generate Answer</button>
<div class="output-wrap">
<div class="label"><span>AI RESPONSE</span><span id="timer"></span></div>
<div id="output"><div class="ph">💡 Your AI-generated answer will appear here. Enter your question above and tap Generate.</div></div>
</div>
</div>
</div>
<script>
let cache={};
async function ask(){
 const q=document.getElementById('q').value.trim();
 const out=document.getElementById('output');
 const timer=document.getElementById('timer');
 const btn=document.getElementById('btn');
 if(!q){out.innerHTML='<div class="ph">⚠️ Please enter a question first.</div>';return;}
 if(cache[q]){out.innerHTML='<div class="fade">'+cache[q]+'</div>'; timer.innerText='⚡ from cache'; return;}
 const start=Date.now();
 btn.disabled=true; btn.innerText='⏳ Generating...';
 out.innerHTML='<div class="loader"><div class="dot"></div><div class="dot"></div><div class="dot"></div><span style="margin-left:10px;color:#6b7280;font-size:13px">Analyzing your query, crafting answer...</span></div>';
 timer.innerText='';
 try{
  let p = q+" . Answer in 70 words max. Format: Definition + 3 Points + Trick. Be direct.";
  let res = await fetch("https://text.pollinations.ai/"+encodeURIComponent(p)+"?model=mistral");
  let text = await res.text();
  if(text.length<20){
    let res2 = await fetch("https://text.pollinations.ai/"+encodeURIComponent(q)+"?model=openai-fast");
    text = await res2.text();
  }
  const tTaken = ((Date.now()-start)/1000).toFixed(1);
  let clean = text.replaceAll("**","").replaceAll("###","");
  cache[q]=clean;
  out.innerHTML='<div class="fade">'+clean+'</div>';
  timer.innerText='⚡ '+tTaken+'s';
 }catch(e){
  out.innerHTML='<div class="ph">❌ Slow network. Please tap Generate again.</div>';
 }
 btn.disabled=false; btn.innerText='⚡ Generate Answer';
}
</script>
</body>
</html>
