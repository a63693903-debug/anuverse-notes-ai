<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnuVerse Notes AI</title>
<style>
*{box-sizing:border-box}
body{font-family:sans-serif;background:#f5f0ff;padding:12px;margin:0}
h2{text-align:center;color:#7c3aed}
.card{background:#fff;padding:16px;border-radius:18px}
textarea{width:100%;height:100px;border-radius:12px;border:2px solid #c4b5fd;padding:12px;font-size:16px}
#btn{background:#7c3aed;color:#fff;border:none;padding:15px;width:100%;border-radius:12px;font-size:17px;font-weight:bold;margin-top:10px;touch-action:manipulation;cursor:pointer;display:block}
#output{background:#f8f7ff;padding:14px;border-radius:12px;margin-top:12px;min-height:60px;white-space:pre-wrap;line-height:1.6;border:1px solid #e9d5ff}
</style>
</head>
<body>
<h2>🚀 AnuVerse Notes AI</h2>
<div class="card">
<textarea id="q" placeholder="Ex: CNN, FET, OS...">Tell me about CNN</textarea>
<button id="btn" onclick="ask()">✨ Ask From Real AI</button>
<div id="output">Answer will appear here...</div>
</div>

<script>
async function ask(){
 const q = document.getElementById('q').value.trim();
 const out = document.getElementById('output');
 const btn = document.getElementById('btn');
 if(!q){ out.innerText="Pehle kuch likho!"; return; }
 
 out.innerText = "⏳ Typing... 1-2 sec";
 btn.innerText = "Thinking...";
 
 try{
  const res = await fetch("https://ai.hackclub.com/chat/completions",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body: JSON.stringify({
     model:"llama-3.3-70b-versatile",
     messages:[
       {role:"system", content:"You are AnuVerse for CSE AIML 1st year. CNN=Convolutional Neural Network, FET=Field Effect Transistor. Always technical meaning. Answer format: Definition: 1 line, 3 Key Points: - - - , Trick: 1 line, Exam Tip: 1 line. Under 100 words. No stars."},
       {role:"user", content: q}
     ]
   })
  });
  const data = await res.json();
  let ans = data.choices[0].message.content.replaceAll("**","").replaceAll("*","");
  out.innerText = ans;
 }catch(e){
  out.innerText = "Error: "+e.message+" . Ek baar aur click karo.";
 }
 btn.innerText = "✨ Ask From Real AI";
}
</script>
</body>
</html>
