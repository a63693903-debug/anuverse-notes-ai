<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnuVerse AI - Ask Anything</title>
<style>
body{font-family:sans-serif;background:#f5f0ff;padding:15px;margin:0}
h2{text-align:center;color:#7c3aed;margin-bottom:2px}
.card{background:white;padding:20px;border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,0.08);margin-top:15px}
textarea{width:100%;height:120px;border-radius:12px;border:2px solid #c4b5fd;padding:12px;font-size:15px;box-sizing:border-box}
button{background:#7c3aed;color:white;border:none;padding:14px;width:100%;border-radius:12px;font-size:17px;font-weight:bold;margin-top:12px;cursor:pointer}
#output{background:#ede9fe;padding:16px;border-radius:12px;margin-top:16px;white-space:pre-wrap;line-height:1.7;color:#222;font-size:14px;min-height:100px}
.tag{text-align:center;font-size:13px;color:#666;margin-top:5px}
</style>
</head>
<body>

<h2>🚀 AnuVerse Notes AI</h2>
<p class="tag"><b>Built by Anushka</b><br>Engineering First Year Student at CSE AIML</p>

<div class="card">
<textarea id="q" placeholder="Kuch bhi pucho... ex: What is Light? What is AIML? Photosynthesis kya hai?"></textarea>
<button onclick="askAI()">✨ AI se Pucho</button>
<div id="output">Yaha tumhara answer ayega...</div>
</div>

<p style="text-align:center;font-size:11px;color:#888;margin-top:15px">Made by Anushka | CSE AIML | 2026</p>

<script>
function askAI(){
  let input = document.getElementById('q').value.trim();
  let out = document.getElementById('output');
  if(input.length < 2){ alert('Pehle kuch likho!'); return; }
  
  let topic = input.toLowerCase();
  let answer = "";

  // DATABASE - Jo bhi puchega isme se answer ayega
  if(topic.includes("light")){
    answer = `💡 Topic: Light

📌 Definition:
Light ek form of energy hai jo humein cheezein dekhne me help karti hai. Ye straight line me travel karti hai.

🔹 Important Points:
1. Speed: 3 x 10^8 m/s
2. Reflection: Mirror se takra kar wapas aana
3. Refraction: Ek medium se dusre me jaane par bend hona
4. Dispersion: White light ka 7 rangon me batna (VIBGYOR)

🔹 Types: Luminous (Sun) & Non-Luminous (Moon)

🎯 Exam ke liye: Mirror formula, Lens formula aur Human Eye bahut important hai.`;
  }
  else if(topic.includes("photosynthesis") || topic.includes("prakash sanshleshan")){
    answer = `🌱 Topic: Photosynthesis

📌 Definition: Plants sunlight ki help se apna khana khud banati hain.

🔹 Equation: CO2 + Water + Sunlight (Chlorophyll) -> Glucose + Oxygen

🔹 Kaha hota hai? Leaf ke Chloroplast me.

🎯 Exam ke liye: Factors affecting photosynthesis aur equation yaad rakho.`;
  }
  else if(topic.includes("aiml") || topic.includes("ai") || topic.includes("artificial")){
    answer = `🤖 Topic: ${input}

📌 Definition:
AIML matlab Artificial Intelligence & Machine Learning. Isme computer ko human ki tarah sochna sikhaya jata hai.

🔹 Types of AI:
1. Narrow AI (Siri, Alexa)
2. General AI (Future AI)
3. Machine Learning - Data se seekhna
4. Deep Learning - Brain jaise neural network

🎯 CSE AIML ke liye: Python, Data Science, Neural Networks bahut important hain. Future isi ka hai!

Aap bhi AIML student ho - isme bahut scope hai! 🚀`;
  }
  else if(topic.includes("computer") || topic.includes("network") || topic.includes("internet")){
    answer = `💻 Topic: ${input}

📌 Definition: Computer Network me 2 ya zyada computers aapas me connect hote hain data share karne ke liye.

🔹 Types: LAN, MAN, WAN
🔹 Important Devices: Router, Switch, Hub
🔹 Protocols: TCP/IP, HTTP, FTP

🎯 Exam ke liye: OSI Model ke 7 layers sabse important hain.`;
  }
  else {
    // YE SABSE IMPORTANT HAI - KOI BHI TOPIC PUCHEGA TO YE GENERIC SMART ANSWER DEGA
    answer = `📌 Topic: ${input}

👋 Hello! Aapne pucha hai: "${input}"

🔹 Definition:
${input} ek bahut hi important topic hai jo exams aur knowledge dono ke liye jaruri hai.

🔹 Main Points Samjho:
1. Iska basic matlab aur introduction kya hai.
2. Iske kitne types / parts hote hain.
3. Iska real-life me kaha use hota hai.
4. Isse related examples kya hain.

🔹 Simple Example ke Saath:
Agar hum ${input} ko simple bhasha me samjhe, to ye ek aisa concept hai jo hamari daily life aur studies dono se juda hua hai. Isko diagram aur points me yaad karna easy rahega.

🎯 Exam Tip by Anushka:
Is topic ko 3 part me yaad karo - Definition, Diagram/Types, aur Advantages/Disadvantages. Full marks pakke!

✅ Aapka Answer 2 Sec Me Ready Hai!
Koi aur topic puchna hai to upar likho 👆`;
  }

  out.innerText = answer;
  out.scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
