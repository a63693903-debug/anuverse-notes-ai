<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnuVerse Notes AI</title>
<style>body{font-family:sans-serif;background:#f5f0ff;padding:15px}h2{text-align:center;color:#7c3aed}.card{background:white;padding:18px;border-radius:18px}textarea{width:100%;height:90px;border-radius:12px;border:2px solid #c4b5fd;padding:12px}button{background:#7c3aed;color:white;border:none;padding:13px;width:100%;border-radius:12px;font-weight:bold} #output{background:#f8f7ff;padding:14px;border-radius:12px;margin-top:12px;line-height:1.6;min-height:50px;white-space:pre-wrap}</style>
</head>
<body>
<h2>🚀 AnuVerse Notes AI</h2>
<div class="card">
<textarea id="q" placeholder="Ex: Natyashastra kya hai?">Tell me about natyashastra</textarea>
<button id="btn" onclick="ask()">✨ Ask From Real AI</button>
<div id="output">Answer from Real AI will appear here...</div>
</div>
<script>
async function ask(){
 let q=document.getElementById("q").value.trim();
 let out=document.getElementById("output");
 let btn=document.getElementById("btn");
 if(!q) return;
 out.innerHTML="⏳ Thinking...";
 btn.disabled=true;

 // Clean prompt - short rakha hai taaki fast aaye
 let prompt = `Explain ${q} in simple English, max 100 words. Format: Definition: 1 line. 3 Key Points: bullets. Trick: 1 line. Exam Tip: 1 line. No stars, no bold.`;

 try{
  // FASTEST MODEL + STREAMING
  const response = await fetch("https://text.pollinations.ai/" + encodeURIComponent(prompt), {
    method: "GET",
    headers: { "Cache-Control": "no-cache" }
  });
  
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let fullText = "";
  out.innerHTML = ""; // streaming start
  
  while(true){
    const {done, value} = await reader.read();
    if(done) break;
    let chunk = decoder.decode(value, {stream:true});
    fullText += chunk;
    // ** stars hata do live
    let clean = fullText.replaceAll("**","").replaceAll("*","").replaceAll("#","");
    out.innerHTML = clean.replaceAll("\n","<br>");
  }
 }catch(e){
  out.innerText = "Network slow, please try again - " + e.message;
 }
 btn.disabled=false;
}
</script>
</body>
</html>
