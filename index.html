<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnuVerse Notes AI</title>
<style>
body{font-family:system-ui;background:#f5f0ff;padding:12px;margin:0}
h2{text-align:center;color:#7c3aed;margin:10px 0 2px}
.sub{text-align:center;font-size:11px;color:#888;margin-bottom:12px}
.card{background:#fff;padding:16px;border-radius:18px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
textarea{width:100%;height:90px;border-radius:12px;border:2px solid #c4b5fd;padding:12px;font-size:15px;box-sizing:border-box;outline:none}
button{background:#7c3aed;color:#fff;border:none;padding:14px;width:100%;border-radius:12px;font-size:16px;font-weight:700;margin-top:10px}
#output{background:#f8f7ff;padding:14px;border-radius:12px;margin-top:12px;line-height:1.7;font-size:14px;white-space:pre-wrap;min-height:70px;border:1px solid #ede9fe}
.tag{background:#ede9fe;color:#7c3aed;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
</style>
</head>
<body>
<h2>🚀 AnuVerse Notes AI</h2>
<div class="sub">Built by Anushka | For CSE AIML First Year</div>
<div class="card">
<textarea id="q" placeholder="Ex: CNN, OS Deadlock, Natyashastra, BJT..."></textarea>
<button id="btn" onclick="ask()">✨ Ask From Real AI</button>
<div id="output">Answer from Real AI will appear here...</div>
</div>

<script>
const cache = JSON.parse(localStorage.getItem("anu_cache_final")||"{}");

async function ask(){
 const q=document.getElementById("q").value.trim();
 const out=document.getElementById("output");
 const btn=document.getElementById("btn");
 if(!q) return;

 if(cache[q]){ out.innerHTML=cache[q]; return; }

 out.innerHTML="⏳ Writing topper notes... 2 sec";
 btn.disabled=true;
 btn.innerText="Thinking...";

 const SYSTEM = `You are AnuVerse Notes AI for B.Tech CSE AIML 1st Year.
You must ALWAYS assume technical meaning:
CNN=Convolutional Neural Network, FET=Field Effect Transistor, BJT=Bipolar Junction Transistor, CN=Computer Networks, OS=Operating System, DBMS=Database, etc. NEVER give general news/media meaning.

Your answer MUST be in this EXACT structure, clean, no **, no #:

Definition: [1 simple
